name: Accessibility scan
run-name: ${{ inputs.url && format('Rescan {0}', inputs.url) || 'Daily scan' }}

on:
  schedule:
    - cron: '17 9 * * *'   # 05:17 US Eastern (summer), 04:17 (winter). Off the hour: GitHub delays top-of-hour runs most.
  workflow_dispatch:
    inputs:
      url:
        description: Scan only this URL (blank = whole site)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: scan-${{ inputs.url || 'full' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Scan
        run: node scan.mjs
        env:
          WPA11Y_SITE: ${{ secrets.WPA11Y_SITE }}
          WPA11Y_SECRET: ${{ secrets.WPA11Y_SECRET }}
          # Passed through env, never interpolated into the script, so the input can't inject shell.
          WPA11Y_URL: ${{ inputs.url }}
